<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Virial: triangle</title>
    <style>
      html, body { height: 100%; margin: 0; background: #05060a; color: #e9ebf3; font: 14px/1.5 system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; outline: none; }
      .engine-error { position: fixed; inset: auto 16px 16px; max-width: 60ch; margin: 0; padding: 12px 16px; background: #0d0f16; border: 1px solid #f2555a; border-radius: 8px; }
    </style>
  </head>
  <body>
    <script type="module">
      if (!navigator.gpu) {
        const p = document.createElement('p');
        p.className = 'engine-error';
        p.textContent = 'This browser does not support WebGPU. Use a recent Chrome, Edge or Safari.';
        document.body.append(p);
      } else {
        const { default: init } = await import('./pkg/triangle.js');
        await init();
      }
    </script>
  </body>
</html>
