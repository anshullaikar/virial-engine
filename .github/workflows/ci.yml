name: CI
# Runs on release tags (v0.1.0, ...) or when started by hand from the Actions
# tab. Day-to-day checks run locally with scripts/check.sh, which also runs the
# GPU tests this CI can't (its runners have no GPU).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.128
      - name: Build every example for the web and check the size budget (3 MB gzipped)
        run: |
          for dir in examples/*/; do
            name=$(basename "$dir")
            [ -f "$dir/Cargo.toml" ] || continue
            scripts/build-web.sh "$name"
            bytes=$(gzip -9 -c "examples/$name/pkg/${name}_bg.wasm" | wc -c)
            test "$bytes" -le 3145728
          done
